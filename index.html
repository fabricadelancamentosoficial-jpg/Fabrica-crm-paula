<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fábrica CRM</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — fixed sidebar, topbar, scrolling view; locked modules render a dimmed live preview under an upgrade card. */
:root{
  --bg:#f4f7f9; --surface:#ffffff; --surface-2:#eef3f6; --surface-3:#e3ecf1;
  --ink:#15252d; --ink-soft:#52666f; --ink-faint:#8a9da5;
  --line:rgba(30,80,110,.12); --line-strong:rgba(30,80,110,.22);
  --brand:#2a6284; --brand-deep:#183b4d; --accent:#3583b6; --accent-soft:rgba(53,131,182,.12); --on-accent:#ffffff;
  --gold:#b7862b; --gold-soft:rgba(183,134,43,.14);
  --good:#1d8a63; --good-soft:rgba(29,138,99,.13);
  --warn:#b7791f; --warn-soft:rgba(183,121,31,.14);
  --bad:#c24d42; --bad-soft:rgba(194,77,66,.12);
  --wa:#1f9d57;
  --scrim:rgba(10,24,32,.5);
  --shadow:0 1px 2px rgba(20,40,55,.05),0 18px 36px -24px rgba(20,40,55,.25);
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --chart:#0f9d6e; --chart-fill:rgba(56,190,214,.30); --mark:#c4501f;
  --ai-bg:#0c1421; --ai-ink:#e8f1f7; --ai-accent:#67d6f2;
  --r-s:8px; --r-m:12px; --r-l:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b161d; --surface:#111f28; --surface-2:#162833; --surface-3:#1c3240;
  --ink:#e8f2f6; --ink-soft:#93adb8; --ink-faint:#5f7c88;
  --line:rgba(140,190,210,.13); --line-strong:rgba(140,190,210,.24);
  --brand:#5fb6e0; --brand-deep:#2a6284; --accent:#5fb6e0; --accent-soft:rgba(95,182,224,.15); --on-accent:#06161d;
  --gold:#e3b75d; --gold-soft:rgba(227,183,93,.14);
  --good:#4fcf98; --good-soft:rgba(79,207,152,.13);
  --warn:#e8b25f; --warn-soft:rgba(232,178,95,.14);
  --bad:#ec7f74; --bad-soft:rgba(236,127,116,.13);
  --wa:#3ccf7c; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 36px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b161d; --surface:#111f28; --surface-2:#162833; --surface-3:#1c3240;
  --ink:#e8f2f6; --ink-soft:#93adb8; --ink-faint:#5f7c88;
  --line:rgba(140,190,210,.13); --line-strong:rgba(140,190,210,.24);
  --brand:#5fb6e0; --brand-deep:#2a6284; --accent:#5fb6e0; --accent-soft:rgba(95,182,224,.15); --on-accent:#06161d;
  --gold:#e3b75d; --gold-soft:rgba(227,183,93,.14);
  --good:#4fcf98; --good-soft:rgba(79,207,152,.13);
  --warn:#e8b25f; --warn-soft:rgba(232,178,95,.14);
  --bad:#ec7f74; --bad-soft:rgba(236,127,116,.13);
  --wa:#3ccf7c; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 36px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{text-decoration:none}
[hidden]{display:none!important}
.top .menu-btn{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex-shrink:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.shell{display:flex;height:100%;min-height:0}
/* sidebar */
.side{width:250px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:20px 18px 14px;display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--accent);background:radial-gradient(circle at 35% 25%,var(--accent-soft),transparent 70%),var(--surface-2);border:1px solid var(--line-strong)}
.word{display:flex;flex-direction:column;line-height:1.15}
.word b{font-family:var(--f-display);font-size:17px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--brand),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.word b sup{font-size:.45em;-webkit-text-fill-color:var(--ink-faint)}
.word span{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.side-scroll{flex:1;overflow-y:auto;padding:4px 12px 12px;min-height:0}
.nav-group{margin-top:14px}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);padding:0 10px 6px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:none;background:transparent;color:var(--ink-soft);font-size:13.5px;font-weight:500;text-align:left}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.active{background:var(--accent-soft);color:var(--brand);font-weight:600}
.nav-btn .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pro{font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.new{font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:999px;background:var(--accent-soft);color:var(--brand)}
.count{font-size:11px;font-family:var(--f-mono);color:var(--ink-faint)}
.side-foot{padding:12px;border-top:1px solid var(--line)}
.plan-card{border-radius:var(--r-m);padding:14px;background:linear-gradient(140deg,var(--brand-deep),#2a6284 60%,#3583b6);color:#fff}
.plan-card small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.plan-card b{display:block;font-family:var(--f-display);font-size:14px;margin:4px 0 8px}
.plan-meter{height:5px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.plan-meter i{display:block;height:100%;width:28%;background:#fff;border-radius:9px}
.plan-card p{margin:8px 0 10px;font-size:11.5px;opacity:.85}
.plan-card button{width:100%;border:none;border-radius:9px;padding:8px;background:#fff;color:#183b4d;font-weight:700;font-size:12.5px}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.menu-btn{display:none}
.top-title{flex:1;min-width:0}
.top-title h1{margin:0;font-family:var(--f-display);font-size:19px;letter-spacing:-.015em;text-wrap:balance}
.top-title p{margin:2px 0 0;font-size:12.5px;color:var(--ink-faint)}
.search{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--surface-2);border:1px solid transparent;width:260px;color:var(--ink-faint)}
.search input{border:none;background:transparent;outline:none;width:100%;color:var(--ink)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-soft);position:relative}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:9px;background:var(--bad);border:2px solid var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid transparent;font-size:13px;font-weight:600;white-space:nowrap}
.btn-primary{background:var(--brand-deep);color:#fff}
:root[data-theme="dark"] .btn-primary{background:var(--accent);color:var(--on-accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{background:var(--accent);color:var(--on-accent)}}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{filter:brightness(1.07)}
.btn-ai{background:linear-gradient(135deg,var(--accent-soft),var(--gold-soft));border-color:var(--line-strong);color:var(--ink)}
.btn-danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.lock-ico{color:var(--gold)}
.avatar{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;font-size:11.5px;font-weight:700;font-family:var(--f-display);flex-shrink:0;color:#fff}
.avatar.sm{width:24px;height:24px;font-size:9.5px}

.view{flex:1;overflow-y:auto;padding:22px 24px 40px;min-height:0;display:flex;flex-direction:column;gap:18px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-head h2{margin:0;font-family:var(--f-display);font-size:15px;font-weight:600}
.card-head p{margin:3px 0 0;font-size:12px;color:var(--ink-faint)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.stat .l{font-size:13.5px;font-weight:500;color:var(--ink-soft)}
.stat .v{margin-top:6px;font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .m{margin-top:4px;font-size:12.5px;color:var(--ink-faint)}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px;min-width:0}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.chart-head h2{margin:0;font-size:16px;font-weight:700}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2)}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--brand)}
.seg button.on{background:var(--brand-deep);color:#fff}
.chart-svg{display:block;width:100%;height:auto}
.chart-cap{margin:6px 0 0;font-size:13px;color:var(--ink-soft)}
.chart-cap b{color:var(--mark);font-weight:700}
.activity{display:flex;align-items:center;gap:12px;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font-size:14px;cursor:pointer}
.activity .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft)}
.activity b{color:var(--ink);font-weight:700}
.activity .amt{font-weight:700;font-variant-numeric:tabular-nums}
.ai-dark{background:var(--ai-bg);color:var(--ai-ink);border:1px solid var(--line-strong);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ai-dark h3{margin:0;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ai-accent)}
.ai-dark p{margin:0;font-size:14.5px;line-height:1.5;max-width:720px}
.ai-dark button{border:none;border-radius:999px;padding:8px 16px;background:var(--ai-accent);color:#08131c;font-weight:700;font-size:13.5px}
.stat.alert .v{color:var(--bad)}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.funnel{display:flex;flex-direction:column;gap:11px}
.f-row{display:grid;grid-template-columns:140px 1fr 40px;align-items:center;gap:12px}
.f-row span{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-track{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.f-fill{height:100%;border-radius:99px;transition:width .4s ease}
.f-row b{text-align:right;font-family:var(--f-mono);font-size:13px}

.list-row{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:var(--surface-2)}
.list-row .grow{flex:1;min-width:0}
.list-row .n{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .s{font-size:11.5px;color:var(--ink-faint)}
.when{font-size:12px;font-weight:600;white-space:nowrap}
.when.late{color:var(--bad)} .when.today{color:var(--accent)} .when.fut{color:var(--ink-soft);font-weight:500}
.empty{padding:28px 12px;text-align:center;color:var(--ink-faint);font-size:13px;border:1px dashed var(--line-strong);border-radius:var(--r-m)}

.ai-strip{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r-l);border:1px solid var(--line-strong);background:linear-gradient(120deg,var(--accent-soft),var(--gold-soft));cursor:pointer}
.ai-strip .ai-orb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--brand);border:1px solid var(--line)}
.ai-strip b{font-family:var(--f-display);font-size:14px}
.ai-strip p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft)}

/* pipeline */
.board-wrap{overflow-x:auto;margin:0 -24px;padding:0 24px 8px}
.board{display:flex;gap:14px;align-items:flex-start;min-width:max-content}
.col{width:272px;flex-shrink:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-l);display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.col-head{padding:12px 14px;border-bottom:1px solid var(--line)}
.col-head-top{display:flex;align-items:center;gap:8px}
.col-dot{width:8px;height:8px;border-radius:99px}
.col-name{font-weight:600;font-size:13px;flex:1}
.col-sum{margin-top:4px;font-size:11.5px;color:var(--ink-faint);font-family:var(--f-mono)}
.col-list{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:70px;flex:1}
.col-list.over{background:var(--accent-soft)}
.lead-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;cursor:grab;display:flex;flex-direction:column;gap:7px;box-shadow:0 1px 2px rgba(20,40,55,.05)}
.lead-card:hover{border-color:var(--line-strong)}
.lead-card.drag{opacity:.4}
.lead-card.late{box-shadow:inset 3px 0 0 var(--bad)}
.lc-top{display:flex;align-items:flex-start;gap:8px}
.lc-name{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.lc-meta{font-size:11.5px;color:var(--ink-faint)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-soft)}
.tag.hot{background:var(--bad-soft);color:var(--bad)}
.tag.warm{background:var(--warn-soft);color:var(--warn)}
.tag.cold{background:var(--accent-soft);color:var(--brand)}
.lc-foot{display:flex;align-items:center;gap:6px;padding-top:7px;border-top:1px solid var(--line)}
.lc-foot .val{font-family:var(--f-mono);font-weight:600;font-size:12.5px;flex:1}
.wa-mini{width:28px;height:28px;border-radius:8px;border:none;display:grid;place-items:center;background:var(--wa);color:#fff;text-decoration:none}
.score{font-size:10.5px;font-weight:700;font-family:var(--f-mono);padding:2px 6px;border-radius:6px;background:var(--gold-soft);color:var(--gold);display:inline-flex;align-items:center;gap:3px;border:none}

/* table */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toolbar .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-soft)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--brand);font-weight:600}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:860px}
th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}

/* locked module page */
.locked{position:relative;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line);min-height:560px;background:var(--surface)}
.locked .preview{filter:saturate(.85);opacity:.55;pointer-events:none;user-select:none;padding:20px}
.locked .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,var(--bg) 88%);display:flex;align-items:flex-end;justify-content:center;padding:24px}
.upsell{width:min(560px,100%);background:var(--surface);border:1px solid var(--line-strong);border-radius:22px;padding:26px;box-shadow:0 30px 60px -30px rgba(10,30,45,.45);text-align:left}
.upsell .badge-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.upsell h2{margin:0 0 6px;font-family:var(--f-display);font-size:21px;letter-spacing:-.02em;text-wrap:balance}
.upsell p{margin:0 0 14px;color:var(--ink-soft)}
.upsell ul{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:8px}
.upsell li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.upsell li svg{color:var(--good);margin-top:2px}
.upsell .acts{display:flex;gap:8px;flex-wrap:wrap}

/* fake previews pieces */
.fake-row{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.bubble{max-width:70%;padding:9px 12px;border-radius:14px;font-size:13px}
.bubble.in{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.out{background:var(--good-soft);align-self:flex-end;border-bottom-right-radius:4px}
.flow-node{padding:12px 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;font-weight:600;min-width:170px}
.flow-node small{display:block;font-weight:500;color:var(--ink-faint);font-size:11px;margin-top:2px}

/* integrations */
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.int{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.int-top{display:flex;align-items:center;gap:10px}
.int-logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.int b{font-size:14px}
.int p{margin:0;font-size:12.5px;color:var(--ink-soft);flex:1}
.int .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.int-cat{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);overflow:hidden}
.modal.sm{max-width:470px}
.m-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h3{margin:0;flex:1;font-family:var(--f-display);font-size:17px}
.m-body{overflow-y:auto;padding:18px 20px}
.m-foot{display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.m-foot .grow{flex:1}
.x{border:none;background:transparent;color:var(--ink-soft);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.x:hover{background:var(--surface-2)}
.lead-layout{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field input,.field select,.field textarea{padding:9px 11px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);width:100%}
.field textarea{resize:vertical;min-height:70px}
.side-panel{display:flex;flex-direction:column;gap:12px}
.panel-box{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;background:var(--surface-2)}
.panel-box h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:6px}
.timeline{display:flex;flex-direction:column;gap:10px;max-height:220px;overflow-y:auto}
.tl{display:flex;gap:9px;font-size:12.5px}
.tl i{width:8px;height:8px;border-radius:99px;background:var(--accent);margin-top:5px;flex-shrink:0}
.tl small{display:block;color:var(--ink-faint);font-size:11px}
.note-add{display:flex;gap:6px;margin-top:10px}
.note-add input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.lock-pop{text-align:center;padding:26px 24px 8px}
.lock-pop .orb{width:60px;height:60px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(140deg,var(--gold-soft),var(--accent-soft));color:var(--gold);border:1px solid var(--line-strong)}
.lock-pop h3{margin:0 0 8px;font-family:var(--f-display);font-size:19px;text-wrap:balance}
.lock-pop p{margin:0 auto 6px;color:var(--ink-soft);max-width:360px}
.plan-pill{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;z-index:80;box-shadow:var(--shadow)}
.settings-list{display:flex;flex-direction:column;gap:8px}
.member{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.member span{flex:1}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-m);background:var(--warn-soft);color:var(--ink);font-size:13px;border:1px solid var(--line)}
.banner .grow{flex:1}
.side-backdrop{display:none}
.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(700px 420px at 50% 25%,var(--accent-soft),transparent 65%),var(--bg);z-index:90}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px 30px 28px;box-shadow:0 40px 70px -34px rgba(10,30,45,.35);display:flex;flex-direction:column;gap:14px}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.login-card h1{margin:0;font-size:20px;letter-spacing:-.01em}
.login-card p{margin:0;color:var(--ink-soft);font-size:13.5px}
.forgot{align-self:center;font-size:13px;font-weight:600;color:var(--brand)}
.forgot:hover{text-decoration:underline}
.login-err:empty{display:none}
.login-err{color:var(--bad);font-size:13px;min-height:18px}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--ink-soft);z-index:85;font-size:14px}
.me-row{display:flex;align-items:center;gap:10px;padding:10px 10px 12px}
.me-row .grow{flex:1;min-width:0}
.me-row b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-row small{color:var(--ink-faint);font-size:11.5px}

@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .side{position:fixed;inset:0 auto 0 0;z-index:60;transform:translateX(-102%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  .side.open{transform:none}
  .side-backdrop.open{display:block;position:fixed;inset:0;background:var(--scrim);z-index:55}
  .top .menu-btn{display:grid}
  .top{padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .view{padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  .board-wrap{margin:0 -16px;padding:0 16px 8px}
  .search{display:none}
  .lead-layout{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr}
  .top .hide-sm{display:none}
}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.stat .v{font-size:24px}.f-row{grid-template-columns:100px 1fr 32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function moneyK(n){n=Number(n)||0;if(n>=1000)return 'R$ '+(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil';return money(n);}

function stage(id){for(var i=0;i<STAGES.length;i++)if(STAGES[i].id===id)return STAGES[i];return STAGES[0];}
function initials(n){n=(n||'?').replace(/\(.*?\)/g,'').trim().split(/\s+/);return ((n[0]||'?')[0]+((n[1]||'')[0]||'')).toUpperCase();}
function teamIdx(id){for(var i=0;i<state.team.length;i++)if(state.team[i].id===id)return i;return -1;}

function digits(p){var d=String(p||'').replace(/\D/g,'');if(d&&d.length<=11)d='55'+d;return d;}
function waLink(l){var msg=(state.waMsg||'').replace(/\{nome\}/g,(l.name||'').replace(/\s*\(exemplo\)/,'').split(' ')[0]).replace(/\{empresa\}/g,state.company||'');return 'https://wa.me/'+digits(l.phone)+'?text='+encodeURIComponent(msg);}
function isClosed(l){return l.stage==='ganho'||l.stage==='perdido';}

var chartDays=14;
function chartCard(){
  var n=chartDays,counts=[],labels=[];
  for(var i=n-1;i>=0;i--){var d=todayISO(-i);labels.push(d);counts.push(state.leads.filter(function(l){return (l.createdAt||'')===d;}).length);}
  // smooth with a 3-day moving average so the curve reads as a trend
  var sm=counts.map(function(c,i){var a=counts[i-1],b=counts[i+1];var s=c,k=1;if(a!=null){s+=a;k++;}if(b!=null){s+=b;k++;}return s/k;});
  var W=800,H=210,pt=18,pb=26,max=Math.max.apply(null,sm.concat([1]));
  var pts=sm.map(function(v,i){return [n>1?i/(n-1)*W:W/2, pt+(1-v/max)*(H-pt-pb)];});
  var d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for(var j=0;j<pts.length-1;j++){var p0=pts[j-1]||pts[j],p1=pts[j],p2=pts[j+1],p3=pts[j+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    c1y=Math.min(Math.max(c1y,pt),H-pb);c2y=Math.min(Math.max(c2y,pt),H-pb);
    d+=' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);}
  var area=d+' L'+W+','+(H-pb)+' L0,'+(H-pb)+' Z';
  var bi=0;counts.forEach(function(c,i){if(c>=counts[bi])bi=i;});
  var total=counts.reduce(function(a,b){return a+b;},0);
  var mk=pts[bi];
  var svg='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Novos leads por dia nos últimos '+n+' dias">'+
    '<defs><linearGradient id="cfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--chart-fill)"/><stop offset="1" stop-color="var(--chart-fill)" stop-opacity="0"/></linearGradient></defs>'+
    '<line x1="0" y1="'+(H-pb)+'" x2="'+W+'" y2="'+(H-pb)+'" stroke="var(--line-strong)" stroke-width="1.5"/>'+
    '<path d="'+area+'" fill="url(#cfill)"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--chart)" stroke-width="4" stroke-linecap="round"/>'+
    (total?'<circle cx="'+mk[0].toFixed(1)+'" cy="'+mk[1].toFixed(1)+'" r="8" fill="var(--surface)" stroke="var(--mark)" stroke-width="4"/>':'')+
    '<text x="0" y="'+(H-6)+'" font-size="13" fill="var(--ink-faint)">'+br(labels[0])+'</text><text x="'+W+'" y="'+(H-6)+'" font-size="13" fill="var(--ink-faint)" text-anchor="end">Hoje</text></svg>';
  var seg='<div class="seg" role="group" aria-label="Período">'+[7,14,30].map(function(x){return '<button data-range="'+x+'" class="'+(x===n?'on':'')+'">'+x+' dias</button>';}).join('')+'</div>';
  var cap=total?'Melhor dia: <b>'+counts[bi]+' lead'+(counts[bi]>1?'s':'')+'</b> em '+br(labels[bi])+' · '+total+' no período':'Nenhum lead novo neste período. Cadastre leads para ver a curva.';
  return '<div class="chart-card"><div class="chart-head"><h2>Entrada de leads</h2>'+seg+'</div>'+svg+'<p class="chart-cap">'+cap+'</p></div>';
}

function leadCard(l){

function vLeads(){
  var list=filtered().slice();
  list.sort(function(a,b){
    var av=a[sortKey],bv=b[sortKey];
    if(sortKey==='value'){av=+av||0;bv=+bv||0;}
    else if(sortKey==='stage'){av=STAGES.indexOf(stage(a.stage));bv=STAGES.indexOf(stage(b.stage));}
    else if(sortKey==='owner'){av=ownerName(a.owner);bv=ownerName(b.owner);}
    else {av=(av||'~').toString().toLowerCase();bv=(bv||'~').toString().toLowerCase();}
    return av<bv?-sortDir:av>bv?sortDir:0;
  });
  var chips='<button class="chip'+(filterStage==='all'?' on':'')+'" data-fstage="all">Todos</button>'+STAGES.map(function(s){return '<button class="chip'+(filterStage===s.id?' on':'')+'" data-fstage="'+s.id+'"><span class="col-dot" style="background:'+s.color+'"></span>'+s.label+'</button>';}).join('');

  h+='<div class="table-wrap"><table><thead><tr>'+cols.map(function(c){return '<th data-sort="'+c[0]+'">'+c[1]+(sortKey===c[0]?(sortDir>0?' ↑':' ↓'):'')+'</th>';}).join('')+'<th></th></tr></thead><tbody>';
  list.forEach(function(l){
    var s=stage(l.stage);
    h+='<tr data-open="'+l.id+'"><td><b>'+esc(l.name)+'</b></td><td class="mono">'+esc(l.phone||'—')+'</td><td>'+esc(l.origin||'—')+'</td>'+

}

    '<div class="field"><label for="fValue">Valor (R$)</label><input id="fValue" type="number" min="0" step="100" value="'+esc(d.value)+'" placeholder="0"></div>'+
    '<div class="field"><label for="fTemp">Temperatura</label><select id="fTemp">'+opt(TEMPS,d.temp,'id','label')+'</select></div>'+
    '<div class="field"><label for="fOwner">Responsável</label><select id="fOwner">'+teamOpts+'</select></div>'+
    '<div class="field"><label for="fNext">Próximo follow-up</label><input id="fNext" type="date" value="'+esc(d.next||'')+'"></div>'+
    '<div class="field wide"><label for="fTags">Etiquetas (separe por vírgula)</label><input id="fTags" value="'+esc((d.tags||[]).join(', '))+'" placeholder="Campanha, VIP"></div>'+
    '<div class="field wide" id="lossWrap"'+(d.stage==='perdido'?'':' hidden')+'><label for="fLoss">Motivo da perda</label><input id="fLoss" value="'+esc(d.lossReason||'')+'" placeholder="Preço, timing, sem resposta..."></div>'+
    '<div class="field wide"><label for="fNotes">Anotações</label><textarea id="fNotes" rows="3" placeholder="O que o lead falou, próximos passos...">'+esc(d.notes||'')+'</textarea></div>'+
  '</div><div class="side-panel">'+
    '<div class="panel-box"><h4>'+ic('spark',14)+'Assistente de IA</h4><div style="display:flex;flex-direction:column;gap:6px">'+
      '<button class="btn btn-ai btn-sm" data-lock="prevendas" data-ltitle="Resumo do lead com IA">'+ic('spark',13)+'Resumir conversa com IA</button>'+
      '<button class="btn btn-ai btn-sm" data-lock="prevendas" data-ltitle="Sugerir próxima mensagem">'+ic('chat',13)+'Sugerir próxima mensagem</button>'+
      '<button class="btn btn-ai btn-sm" data-lock="scoring" data-ltitle="Calcular chance de fechamento">'+ic('target',13)+'Calcular chance de fechar</button>'+
      '<button class="btn btn-ai btn-sm" data-lock="agentes" data-ltitle="Passar para o agente de IA">'+ic('bot',13)+'Passar para o agente de IA</button>'+
    '</div></div>'+
    '<div class="panel-box"><h4>'+ic('check',14)+'Histórico</h4><div class="timeline" id="tl">'+tl+'</div>'+
      (isNew?'':'<div class="note-add"><input id="fNote" placeholder="Registrar contato ou nota"><button class="btn btn-ghost btn-sm" data-addnote="'+d.id+'">Registrar</button></div>')+'</div>'+
    '<div class="panel-box"><h4>'+ic('chat',14)+'Conversa do WhatsApp</h4><p style="margin:0 0 8px;font-size:12.5px;color:var(--ink-soft)">Veja a conversa inteira dentro do lead.</p><button class="btn btn-ghost btn-sm" data-lock="inbox">'+ic('lock',13)+'Ver conversa</button></div>'+
  '</div></div></div>'+
  '<div class="m-foot">'+(isNew?'':'<button class="btn btn-danger btn-sm" data-delask="'+d.id+'">'+ic('trash',14)+'Excluir</button>')+'<span class="grow"></span><span id="formErr" style="color:var(--bad);font-size:12.5px"></span><button class="btn btn-ghost" data-close="1">Cancelar</button><button class="btn btn-primary" data-savelead="'+d.id+'" data-isnew="'+(isNew?1:0)+'">'+(isNew?'Adicionar lead':'Salvar')+'</button></div>';
  openModal(html);
  var st=document.getElementById('fStage');
  st.addEventListener('change',function(){document.getElementById('lossWrap').hidden=st.value!=='perdido';});
  setTimeout(function(){var n=document.getElementById('fName');if(n&&isNew)n.focus();},30);
}

function saveLead(id,isNew){
  var g=function(x){return document.getElementById(x);};
  var name=g('fName').value.trim();
  if(!name){g('formErr').textContent='Informe o nome do lead.';g('fName').focus();return;}
  var prev=state.leads.filter(function(l){return l.id===id;})[0];
  var lead=Object.assign({},prev||{id:id,createdAt:todayISO(),history:[{at:todayISO(),text:'Lead criado'}]},{
    name:name,phone:g('fPhone').value.trim(),email:g('fEmail').value.trim(),origin:g('fOrigin').value,stage:g('fStage').value,
    value:Number(g('fValue').value)||0,temp:g('fTemp').value,owner:g('fOwner').value,next:g('fNext').value,
    tags:g('fTags').value.split(',').map(function(t){return t.trim();}).filter(Boolean),notes:g('fNotes').value,
    lossReason:g('fStage').value==='perdido'?g('fLoss').value.trim():''
  });
  var btn=document.querySelector('[data-savelead]');if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  var row=leadToRow(lead);
  var req=isNew?sb.from('leads').insert(Object.assign({id:id},row)):sb.from('leads').update(row).eq('id',id);
  req.then(function(r){
    if(r.error){if(btn){btn.disabled=false;btn.textContent='Salvar';}g('formErr').textContent='Não foi possível salvar. Tente de novo.';console.error(r.error);return;}
    if(isNew)state.leads.unshift(lead);else state.leads=state.leads.map(function(l){return l.id===id?lead:l;});
    closeModal();commit();toast(isNew?'Lead adicionado':'Lead salvo');
    if(isNew)logEvent(id,'Lead criado');
    else if(prev&&prev.stage!==lead.stage)logEvent(id,'Moveu para '+stage(lead.stage).label);
  });
}

function moveLead(id,to){
  var l=state.leads.filter(function(x){return x.id===id;})[0];
  if(!l||l.stage===to)return;
  l.stage=to;
  commit();toast('Movido para '+stage(to).label);
  sb.from('leads').update({stage:to}).eq('id',id).then(function(r){if(r.error)return fail(r.error);logEvent(id,'Moveu para '+stage(to).label);});
  if(to==='perdido'&&!l.lossReason)leadModal(id);
}

/* ---------- export / import ---------- */
function exportData(){
  var rows=[['Nome','WhatsApp','E-mail','Origem','Etapa','Responsável','Valor','Temperatura','Próximo follow-up','Etiquetas','Anotações','Criado em']];
  state.leads.forEach(function(l){rows.push([l.name,l.phone,l.email,l.origin,stage(l.stage).label,ownerName(l.owner),l.value,l.temp,l.next,(l.tags||[]).join('; '),l.notes,l.createdAt]);});
  var data=rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[";\n,]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\n');
  var blob=new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='leads-'+todayISO()+'.csv';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  toast('Planilha exportada');
}
function importFile(file){
  var r=new FileReader();
  r.onload=function(){
    var d;try{d=JSON.parse(r.result);if(!d||!Array.isArray(d.leads))throw new Error();}catch(e){toast('Arquivo inválido. Use um backup exportado pelo CRM.');return;}
    var leads=d.leads.filter(function(l){return !l.example&&l.name;});
    if(!leads.length){toast('O backup não tem leads para importar.');return;}
    var ok=['novo','contato','qualificado','reuniao','proposta','ganho','perdido'];
    var rows=leads.map(function(l){return {name:String(l.name).slice(0,200),phone:l.phone||'',email:l.email||'',origin:l.origin||'',stage:ok.indexOf(l.stage)>=0?l.stage:'novo',value:Number(l.value)||0,temp:['hot','warm','cold'].indexOf(l.temp)>=0?l.temp:'warm',next_followup:l.next||null,tags:Array.isArray(l.tags)?l.tags:[],notes:l.notes||'',loss_reason:l.lossReason||''};});
    sb.from('leads').insert(rows).then(function(res){if(res.error)return fail(res.error);toast(rows.length+' leads importados');loadAll();});
  };
  r.readAsText(file);
}

/* ---------- drag & drop ---------- */
function bindDnD(){
  document.querySelectorAll('.lead-card').forEach(function(c){
    c.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('drag');});
    c.addEventListener('dragend',function(){c.classList.remove('drag');});
  });
  document.querySelectorAll('[data-drop]').forEach(function(z){
    z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',function(){z.classList.remove('over');});
    z.addEventListener('drop',function(e){e.preventDefault();z.classList.remove('over');moveLead(e.dataTransfer.getData('text/plain'),z.dataset.drop);});
  });
}

/* ---------- events ---------- */
function setView(v){view=v;try{history.replaceState(null,'','#'+v);}catch(e){}document.getElementById('side').classList.remove('open');document.getElementById('sideBackdrop').classList.remove('open');render();document.getElementById('view').scrollTop=0;}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-nav],[data-lock],[data-lockint],[data-upgrade],[data-newlead],[data-open],[data-close],[data-savelead],[data-delask],[data-delyes],[data-addnote],[data-fstage],[data-reload],[data-range],[data-sort],[data-export],[data-savecfg],[data-renamemember],[data-logout],[data-copy],#themeBtn,#menuBtn,#scrim,[data-wa],a');
  if(!t)return;
  if(t.id==='scrim'){if(e.target===t)closeModal();return;}
  if(t.dataset.wa!==undefined||t.tagName==='A'){
    if(t.dataset.wa){logEvent(t.dataset.wa,'Abriu conversa no WhatsApp');}
    e.stopPropagation();return;
  }
  if(t.dataset.nav){setView(t.dataset.nav);return;}
  if(t.dataset.lock){e.stopPropagation();if(t.dataset.lock==='integracoes-mc'){lockPopup('automacoes','Importar leads do ManyChat');return;}lockPopup(t.dataset.lock,t.dataset.ltitle);return;}
  if(t.dataset.lockint){lockPopup('automacoes','Integração com '+t.dataset.lockint);return;}
  if(t.dataset.upgrade){upgradeModal();return;}
  if(t.dataset.newlead){leadModal(null);return;}
  if(t.dataset.open){if(t.classList.contains('lead-card')&&t.classList.contains('drag'))return;leadModal(t.dataset.open);return;}
  if(t.dataset.close){closeModal();return;}
  if(t.dataset.savelead){saveLead(t.dataset.savelead,t.dataset.isnew==='1');return;}
  if(t.dataset.delask){t.outerHTML='<span style="font-size:12.5px">Excluir de vez?</span><button class="btn btn-danger btn-sm" data-delyes="'+t.dataset.delask+'">Sim, excluir</button>';return;}
  if(t.dataset.delyes){var did=t.dataset.delyes;state.leads=state.leads.filter(function(l){return l.id!==did;});closeModal();commit();sb.from('leads').delete().eq('id',did).then(function(r){if(r.error)return fail(r.error);toast('Lead excluído');});return;}
  if(t.dataset.addnote){var inp=document.getElementById('fNote');var txt=inp.value.trim();if(!txt)return;var ld=state.leads.filter(function(x){return x.id===t.dataset.addnote;})[0];if(!ld)return;logEvent(ld.id,txt);inp.value='';document.getElementById('tl').innerHTML=ld.history.slice().reverse().map(function(h){return '<div class="tl"><i></i><div>'+esc(h.text)+'<small>'+br(h.at)+'</small></div></div>';}).join('');toast('Registrado');return;}
  if(t.dataset.reload){loadAll();return;}
  if(t.dataset.range){chartDays=+t.dataset.range;render();return;}
  if(t.dataset.fstage){filterStage=t.dataset.fstage;render();return;}
  if(t.dataset.sort){if(sortKey===t.dataset.sort)sortDir=-sortDir;else{sortKey=t.dataset.sort;sortDir=1;}render();return;}
  if(t.dataset.export){exportData(t.dataset.export);return;}
  if(t.dataset.savecfg){state.company=document.getElementById('cfgCompany').value.trim()||'Minha empresa';state.waMsg=document.getElementById('cfgMsg').value;commit();sb.from('settings').update({company:state.company,wa_msg:state.waMsg}).eq('id',1).then(function(r){if(r.error)return fail(r.error);toast('Configurações salvas');});return;}
  if(t.dataset.renamemember){var mid=t.dataset.renamemember;var nm=document.getElementById('mem-'+mid).value.trim();if(!nm)return;state.team.forEach(function(p){if(p.id===mid)p.name=nm;});commit();sb.from('profiles').update({name:nm}).eq('id',mid).then(function(r){if(r.error)return fail(r.error);toast('Nome salvo');});return;}
  if(t.dataset.logout){sb.auth.signOut().then(function(){location.reload();});return;}
  if(t.dataset.copy){var ta=document.getElementById('copyArea');var done=function(){toast('Copiado');};try{navigator.clipboard.writeText(ta.value).then(done,function(){ta.select();});}catch(err){ta.select();}return;}
  if(t.id==='themeBtn'){var root=document.documentElement;var cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var nx=cur==='dark'?'light':'dark';root.setAttribute('data-theme',nx);try{localStorage.setItem(THEME_KEY,nx);}catch(er){}return;}
  if(t.id==='menuBtn'){document.getElementById('side').classList.add('open');document.getElementById('sideBackdrop').classList.add('open');return;}
});
document.getElementById('sideBackdrop').addEventListener('click',function(){this.classList.remove('open');document.getElementById('side').classList.remove('open');});
document.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;var pos=e.target.selectionStart;render();var n=document.getElementById('q');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(er){}}}});
document.addEventListener('change',function(e){if(e.target.id==='importFile'&&e.target.files[0])importFile(e.target.files[0]);});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='fNote'){var b=document.querySelector('[data-addnote]');if(b)b.click();}});
window.addEventListener('hashchange',function(){var h=(location.hash||'').slice(1);if(h&&findNav(h)&&h!==view){view=h;render();}});

function showLogin(msg){
  var el=document.createElement('div');el.className='login';el.id='login';
  el.innerHTML='<form class="login-card" id="loginForm"><div class="login-brand"><span class="mark">F</span><span class="word"><b>fábrica<sup>®</sup></b><span>CRM comercial</span></span></div>'+
    
    '<div class="field"><label for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="username" required></div>'+
    '<div class="field"><label for="lgPass">Senha</label><input id="lgPass" type="password" autocomplete="current-password" required></div>'+
    '<div class="login-err" id="lgErr">'+esc(msg||'')+'</div>'+
    '<button class="btn btn-primary" type="submit" id="lgBtn">Entrar</button>'+
    '<a class="forgot" href="https://wa.me/'+FABRICA_WA+'?text='+encodeURIComponent('Olá, Fábrica! Esqueci minha senha do CRM. Pode me ajudar?')+'" target="_blank" rel="noopener">Esqueci minha senha</a></form>';
  document.body.appendChild(el);
  document.getElementById('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    var btn=document.getElementById('lgBtn');btn.disabled=true;btn.textContent='Entrando...';
    sb.auth.signInWithPassword({email:document.getElementById('lgEmail').value.trim(),password:document.getElementById('lgPass').value}).then(function(r){
      if(r.error){btn.disabled=false;btn.textContent='Entrar';document.getElementById('lgErr').textContent=/invalid/i.test(r.error.message)?'E-mail ou senha incorretos.':'Não foi possível entrar. Tente de novo.';return;}
      el.remove();start(r.data.user);
    });
  });
  setTimeout(function(){var i=document.getElementById('lgEmail');if(i)i.focus();},30);
}
var started=false;
function start(user){
  if(started)return;started=true;
  state.me={id:user.id,email:user.email};
  var ld=document.createElement('div');ld.className='loading';ld.id='loading';ld.textContent='Carregando seus leads...';document.body.appendChild(ld);
  loadAll().then(function(){var x=document.getElementById('loading');if(x)x.remove();});
  sb.channel('crm-sync').on('postgres_changes',{event:'*',schema:'public'},scheduleReload).subscribe();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)scheduleReload();});
}
sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s)start(s.user);else showLogin();});
sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')location.reload();});
})();
</script>
